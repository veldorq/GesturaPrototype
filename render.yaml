services:
  # Flask Backend API
  - type: web
    name: gestura-api
    env: python
    runtime: python
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn --worker-class gevent -w 1 --bind 0.0.0.0:$PORT app_web:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Next.js Frontend
  - type: web
    name: gestura-web
    env: node
    runtime: node
    rootDir: gestura-web
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
